# Prefix is Ctrl-a (GNU Screen). Ctrl-a Ctrl-a sends a real Ctrl-a to the pane.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

setw -g mode-keys vi
set  -g status-keys vi
set  -s escape-time 0
set  -g focus-events on
set  -g mouse on
# Attach-time wheel backlog is flushed by the tmux() wrapper in .dima.shellrc.
set  -g history-limit 100000
set  -g default-terminal "tmux-256color"
set  -as terminal-features ",*:RGB"
set  -s copy-command "pbcopy"

bind r source-file ~/.tmux.conf \; display-message "reloaded ~/.tmux.conf"

# Drop leftover root maps from an older conf (source-file does not unbind).
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
unbind -n 'C-\'
unbind -T copy-mode-vi C-h
unbind -T copy-mode-vi C-j
unbind -T copy-mode-vi C-k
unbind -T copy-mode-vi C-l
unbind -T copy-mode-vi 'C-\'
unbind C-l

# Copy mode: prefix-v ([ still works). v/V/C-v match vim visual modes.
bind v copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel
# Escape clears the selection (default). q leaves copy mode.

# Splits keep the current pane's directory. | is :vsplit, - is :split.
bind "|" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"
bind %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c  new-window      -c "#{pane_current_path}"

# prefix hjkl moves panes. last-window moves to prefix C-l.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind C-l last-window

# Ctrl-PageUp / Ctrl-PageDown cycle windows without the prefix.
bind -n C-PPage previous-window
bind -n C-NPage next-window

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# >>> update-tmux >>>
# Per-window tab colours. Default current=reverse hides them.
# Do not put #[bg=…] inside #{?a,b,c} — commas split arguments.
set -g window-status-current-style none
set -g window-status-style none
if-shell "test -f /Users/dima/tmuxgh/paint_windows.py" 'run-shell -b "python3 /Users/dima/tmuxgh/paint_windows.py"'
# <<< update-tmux <<<
